<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Smart Parking{% endblock %} | Smart Car Parking Management System</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232a78d6'/%3E%3Ctext x='16' y='23' font-size='20' font-weight='700' font-family='Arial' text-anchor='middle' fill='white'%3EP%3C/text%3E%3C/svg%3E">
  {% block head %}{% endblock %}
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="{% block body_class %}{% endblock %}">
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">P</span> Smart Parking <small>Mumbai</small></a>
    <nav>
      <a href="/" class="{{ 'on' if active == 'map' }}">Find<span class="wide"> Parking</span></a>
      <a href="/bookings" class="{{ 'on' if active == 'bookings' }}"><span class="wide">My </span>Bookings</a>
      <a href="/dashboard" class="{{ 'on' if active == 'dashboard' }}">Analytics</a>
    </nav>
  </header>
  {% block content %}{% endblock %}
  <div id="toast" class="toast" role="status"></div>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
